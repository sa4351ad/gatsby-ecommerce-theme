services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ga_password}
      POSTGRES_DB: ${POSTGRES_DB:-ga_voting}
    volumes:
      - ga_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ga}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ga}:${POSTGRES_PASSWORD:-ga_password}@postgres:5432/${POSTGRES_DB:-ga_voting}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      VOTE_HASH_SECRET: ${VOTE_HASH_SECRET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      DEFAULT_TIMEZONE: Asia/Riyadh
    volumes:
      - ga_uploads:/data/uploads
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # يمرّر خادم Next.js نفسه طلبات /api/* إلى حاوية الـ API عبر شبكة Docker الداخلية —
      # يُبقي هذا كوكيز الجلسة كوكيز من الطرف الأول من منظور المتصفح دومًا، حتى عند وضع
      # الواجهة والـ API خلف نطاقين فرعيين منفصلين وراء Nginx/Caddy (راجع next.config.js).
      API_PROXY_TARGET: http://api:4000
    ports:
      - "3000:3000"

volumes:
  ga_postgres_data:
  ga_uploads:
